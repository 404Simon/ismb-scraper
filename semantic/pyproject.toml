[project]
name = "ismb-semantic"
version = "0.1.0"
description = "Embed, cluster, and label ISMB papers"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "sentence-transformers>=5",
    "torch>=2.15.0",
]

[project.scripts]
ismb-semantic = "ismb_semantic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ismb_semantic"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

